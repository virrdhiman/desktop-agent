name: Signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            builderArgs: --win --config.win.signAndEditExecutable=true
          - os: macos-latest
            artifact: macos
            builderArgs: --mac
          - os: ubuntu-24.04
            artifact: linux
            builderArgs: --linux
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ startsWith(matrix.os, 'windows') && secrets.WIN_CSC_LINK || (startsWith(matrix.os, 'macos') && secrets.MAC_CSC_LINK || '') }}
      CSC_KEY_PASSWORD: ${{ startsWith(matrix.os, 'windows') && secrets.WIN_CSC_KEY_PASSWORD || (startsWith(matrix.os, 'macos') && secrets.MAC_CSC_KEY_PASSWORD || '') }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require Windows signing secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: bash
        run: test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD"
      - name: Require macOS signing and notarization secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        run: test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
      - name: Run agent evaluations
        if: runner.os != 'Linux'
        run: npm run agent:evals
        env:
          VD_AGENT_AUTO_APPROVE_TOOLS: "1"
      - name: Run agent evaluations under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run agent:evals
        env:
          VD_AGENT_AUTO_APPROVE_TOOLS: "1"
      - name: Build signed release artifacts
        run: npm run electron:build -- ${{ matrix.builderArgs }} --publish never
      - name: Smoke packaged Windows app
        if: runner.os == 'Windows'
        run: node scripts/smoke.mjs --exe "release/win-unpacked/VD Agent.exe"
      - name: Smoke packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          exe=$(find release -path '*/VD Agent.app/Contents/MacOS/VD Agent' -type f -print -quit)
          test -n "$exe"
          node scripts/smoke.mjs --exe "$exe"
      - name: Smoke packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs --exe release/linux-unpacked/vd-agent
      - uses: actions/upload-artifact@v4
        with:
          name: vd-agent-${{ matrix.artifact }}
          path: |
            release/*
            !release/*-unpacked/**
            !release/mac*/**
            !release/builder-*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: vd-agent-*
          path: release
          merge-multiple: true
      - name: Write combined checksums
        run: node scripts/checksums.mjs
      - name: Create draft release and upload verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "VD Agent ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
