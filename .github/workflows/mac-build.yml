name: macOS unsigned build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Make node-pty spawn-helper executable
        run: chmod +x node_modules/node-pty/prebuilds/darwin-*/spawn-helper
      - run: npm run build
      - name: Build unsigned DMG
        run: npx electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          APPLE_ID: ''
          APPLE_APP_SPECIFIC_PASSWORD: ''
          APPLE_TEAM_ID: ''
      - uses: actions/upload-artifact@v4
        with:
          name: vd-agent-macos-unsigned
          path: release/*.dmg
          if-no-files-found: error
