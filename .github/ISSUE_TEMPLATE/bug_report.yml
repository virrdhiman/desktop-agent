name: Bug report
description: Something in VD Agent is broken or behaves unexpectedly
title: "bug: "
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: A short description of the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VD Agent version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, or Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: From `node -v`, if you are running from source.
      placeholder: "v22.19.0"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Do not paste API keys, .env files, or private source code.
